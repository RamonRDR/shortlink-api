name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Type check
        run: mypy src/shortlink
      - name: Build wheel
        run: python -m build --wheel

  integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shortlink
          POSTGRES_PASSWORD: ci-testing-only-password
          POSTGRES_DB: shortlink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shortlink -d shortlink_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      SHORTLINK_DATABASE_URL: postgresql+psycopg://shortlink:ci-testing-only-password@127.0.0.1:5432/shortlink_test
      SHORTLINK_ADMIN_API_KEY: ci-only-example-key-please-never-use-in-production
      SHORTLINK_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run Alembic migrations
        run: alembic upgrade head
      - name: Verify migration drift
        run: alembic check
      - name: Test
        run: pytest -q

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: 'ci@password:with/special?#chars'
      SHORTLINK_ADMIN_API_KEY: 'ci-only-example-key-please-never-use-in-production'
    steps:
      - uses: actions/checkout@v5
      - name: Build and start with reserved password characters
        run: docker compose up --build -d
      - name: Check API health
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color app
          exit 1
      - name: Shut down disposable containers
        if: always()
        run: docker compose down --volumes --remove-orphans
