services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shortlink
      POSTGRES_DB: shortlink
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortlink -d shortlink"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      SHORTLINK_DATABASE_URL: "postgresql+psycopg://shortlink:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/shortlink"
      SHORTLINK_ADMIN_API_KEY: "${SHORTLINK_ADMIN_API_KEY:?Set SHORTLINK_ADMIN_API_KEY in .env}"
      SHORTLINK_BASE_URL: "${SHORTLINK_BASE_URL:-http://localhost:8000}"
      SHORTLINK_MAX_REQUESTS_PER_MINUTE: "${SHORTLINK_MAX_REQUESTS_PER_MINUTE:-60}"
    command: ["sh", "-c", "alembic upgrade head && uvicorn shortlink.main:app --host 0.0.0.0 --port 8000"]
volumes:
  postgres_data:
