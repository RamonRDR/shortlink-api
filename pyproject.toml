[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shortlink-api"
version = "0.1.0"
description = "A secure, observable URL shortener built with FastAPI and PostgreSQL"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Ramon Rodriguez" }]
dependencies = [
    "fastapi>=0.116,<1",
    "uvicorn>=0.35,<1",
    "sqlalchemy>=2.0.42,<3",
    "psycopg[binary]>=3.2.9,<4",
    "alembic>=1.16,<2",
    "pydantic-settings>=2.10,<3",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
    "mypy>=1.17,<2",
    "build>=1.3,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires a PostgreSQL database"]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
packages = ["shortlink"]
